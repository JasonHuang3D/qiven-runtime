name: CI

run-name: CI / ${{ inputs.jobs }}

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Validation units: full, windows, linux, macos"
        required: true
        default: full
        type: string
      candidate:
        description: >-
          Full 40-hex-char SHA of the qiven-runtime commit under test
        required: true
        type: string
      workspace_ref:
        description: >-
          Optional qiven-workspace ref for deliberate old-graph reproduction;
          absent = workspace default branch head
        required: false
        type: string

# Trigger registration refresh 2026-09-22: phantom zero-job push runs were
# created for every push against this dispatch-only file (stale GitHub-side
# event registration since repo creation). This comment change forces
# re-registration. See qiven-context session-ci-handoff-contract.md.
#
# 2026-10-03 adjudicated design (cancel CI dependency pins): the hardcoded
# node checkout pins are removed. Every dispatch names its own candidate
# (required, full 40-hex-char SHA of this repo's commit under test) and an
# optional workspace_ref for deliberate old-graph reproduction (absent =
# workspace default branch head). The resolve job reads workspace.lock.json
# at that workspace ref and every node checkout rides the resolved lock
# SHAs; no node pins live in this file.
permissions:
  contents: read

jobs:
  resolve:
    name: Resolve run graph (candidate + workspace lock)
    runs-on: ubuntu-24.04
    outputs:
      candidate: ${{ steps.candidate.outputs.candidate }}
      workspace_commit: ${{ steps.identity.outputs.workspace_commit }}
      devkit_sha: ${{ steps.lock.outputs.devkit_sha }}
      foundation_sha: ${{ steps.lock.outputs.foundation_sha }}
      context_draft_sha: ${{ steps.lock.outputs.context_draft_sha }}
      third_party_win_sha: ${{ steps.lock.outputs.third_party_win_sha }}
      toolchain_win_sha: ${{ steps.lock.outputs.toolchain_win_sha }}
    steps:
      - name: Validate candidate admission (typed)
        id: candidate
        shell: bash
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "[FAIL] resolve/candidate: WHAT: the candidate input is malformed"
            echo "  or missing - it must be the exact full 40-hex-char SHA of the"
            echo "  qiven-runtime commit under test"
            echo "  WHY: a dispatch must name the exact head under test; a silent"
            echo "  branch-head fallback would validate an unstated graph - the"
            echo "  defect class this redesign eliminates (rule: runtime/ci-resolve)"
            echo "  EVIDENCE: received candidate input string: \"$CANDIDATE\""
            echo "  NEXT action: FIX - re-dispatch with the full 40-char SHA of the"
            echo "  intended head; this workflow never falls back to a branch head"
            exit 1
          fi
          echo "candidate=${CANDIDATE,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout workspace control (dispatch ref or default)
        uses: actions/checkout@v6
        with:
          repository: JasonHuang3D/qiven-workspace
          ref: ${{ inputs.workspace_ref }}
          path: qiven-workspace

      - name: Resolve dependency graph from the workspace lock
        id: lock
        shell: bash
        env:
          LOCK_NODE_MAP: >-
            qiven-devkit=devkit_sha
            qiven-foundation=foundation_sha
            qiven-context-draft=context_draft_sha
            qiven-third-party-win=third_party_win_sha
            qiven-toolchain-win=toolchain_win_sha
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          lock_path = "qiven-workspace/workspace.lock.json"
          try:
              with open(lock_path, encoding="utf-8") as handle:
                  lock = json.load(handle)
          except Exception as error:
              print(f"error: WHAT: cannot read the workspace lock at {lock_path}:"
                    f" {error}", file=sys.stderr)
              print("error: WHY: the dispatch graph is resolved from the lock;"
                    " an unreadable lock has no fallback (rule: runtime/ci-resolve)",
                    file=sys.stderr)
              print(f"error: EVIDENCE: {type(error).__name__}: {error}", file=sys.stderr)
              print("error: NEXT action: DIAGNOSE - inspect the dispatched"
                    " workspace ref (rule: runtime/ci-resolve)", file=sys.stderr)
              sys.exit(1)
          if lock.get("schema") != "qiven-workspace-lock-v1":
              print("error: WHAT: unsupported lock schema", file=sys.stderr)
              print("error: WHY: the resolver reads only the admitted"
                    " qiven-workspace-lock-v1 shape; schema drift is a typed"
                    " stop, never a best-effort parse (rule: runtime/ci-resolve)",
                    file=sys.stderr)
              print("error: EVIDENCE: schema=" + repr(lock.get("schema")),
                    file=sys.stderr)
              print("error: NEXT action: DIAGNOSE - inspect the dispatched"
                    " workspace ref (rule: runtime/ci-resolve)", file=sys.stderr)
              sys.exit(1)
          pairs = [item.split("=", 1) for item in os.environ["LOCK_NODE_MAP"].split()]
          resolved = {}
          unresolved = []
          evidence = []
          for node, key in pairs:
              commit = lock.get("nodes", {}).get(node, {}).get("commit")
              if commit and re.fullmatch(r"[0-9a-f]{40}", commit):
                  resolved[key] = commit
              else:
                  unresolved.append(node)
                  evidence.append(f"{node}={commit!r}")
          if unresolved:
              print("error: WHAT: the lock does not resolve node(s): "
                  + ", ".join(sorted(unresolved)), file=sys.stderr)
              print("error: WHY: the dispatch graph must be fully stated by the"
                  " lock; an unresolved node has no fallback"
                  " (rule: runtime/ci-resolve)", file=sys.stderr)
              print("error: EVIDENCE: workspace.lock.json node entries: "
                  + ", ".join(sorted(evidence)), file=sys.stderr)
              print("error: NEXT action: DIAGNOSE - inspect workspace.lock.json"
                  " at the dispatched workspace ref", file=sys.stderr)
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, sha in resolved.items():
                  print(f"{key}={sha}", file=output)
          PY

      - name: Record run identity (this echo is the record)
        id: identity
        shell: bash
        env:
          CANDIDATE: ${{ steps.candidate.outputs.candidate }}
          WORKSPACE_REF: ${{ inputs.workspace_ref }}
          DEVKIT_SHA: ${{ steps.lock.outputs.devkit_sha }}
          FOUNDATION_SHA: ${{ steps.lock.outputs.foundation_sha }}
          CONTEXT_DRAFT_SHA: ${{ steps.lock.outputs.context_draft_sha }}
          THIRD_PARTY_WIN_SHA: ${{ steps.lock.outputs.third_party_win_sha }}
          TOOLCHAIN_WIN_SHA: ${{ steps.lock.outputs.toolchain_win_sha }}
        run: |
          set -euo pipefail
          workspace_commit="$(git -C qiven-workspace rev-parse HEAD)"
          if [[ -z "$WORKSPACE_REF" ]]; then
            workspace_ref_used="default"
          else
            workspace_ref_used="$WORKSPACE_REF"
          fi
          echo "run identity (record):"
          echo "  candidate: $CANDIDATE"
          echo "  workspace_ref used: $workspace_ref_used"
          echo "  workspace commit (lock source): $workspace_commit"
          echo "  dependency graph (node -> resolved SHA):"
          echo "    qiven-devkit -> $DEVKIT_SHA"
          echo "    qiven-foundation -> $FOUNDATION_SHA"
          echo "    qiven-context-draft -> $CONTEXT_DRAFT_SHA"
          echo "    qiven-third-party-win -> $THIRD_PARTY_WIN_SHA"
          echo "    qiven-toolchain-win -> $TOOLCHAIN_WIN_SHA"
          echo "workspace_commit=$workspace_commit" >> "$GITHUB_OUTPUT"

  plan:
    name: Validation plan
    runs-on: ubuntu-24.04
    outputs:
      windows: ${{ steps.plan.outputs.windows }}
      linux: ${{ steps.plan.outputs.linux }}
      macos: ${{ steps.plan.outputs.macos }}
    steps:
      - id: plan
        shell: bash
        env:
          REQUESTED: ${{ inputs.jobs }}
        run: |
          case "$REQUESTED" in
            full) selected="windows linux macos" ;;
            windows|linux|macos) selected="$REQUESTED" ;;
            *)
              echo "error: WHAT: unknown validation unit: \"$REQUESTED\" (allowed:" >&2
              echo "  windows, linux, macos)" >&2
              echo "  WHY: the plan is the typed admission surface - an unknown unit" >&2
              echo "  would validate nothing while appearing to run CI (rule: runtime/ci-plan)" >&2
              echo "  EVIDENCE: received jobs input string: \"$REQUESTED\"" >&2
              echo "  NEXT action: FIX - re-dispatch with jobs=full or one of:" >&2
              echo "  windows, linux, macos" >&2
              exit 1 ;;
          esac
          for unit in windows linux macos; do
            if [[ " $selected " == *" $unit "* ]]; then value=true; else value=false; fi
            echo "$unit=$value" >> "$GITHUB_OUTPUT"
          done

  validate:
    name: ${{ matrix.name }}
    needs: [plan, resolve]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: windows, name: Windows MSVC x64, os: windows-2022 }
          - { id: linux, name: Linux GCC x64, os: ubuntu-24.04 }
          - { id: macos, name: macOS AppleClang arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    # matrix is NOT available in a job-level if (GitHub evaluates it before
    # strategy expansion); per-unit gating lives at step level via the plan
    # output keyed by matrix.id (windows|linux|macos match the plan outputs).
    # The former job-level if was INVALID since repo creation (template-
    # inherited) and made every push carrying this file create a zero-job
    # failing run - the "phantom push runs" misclassified as a platform
    # anomaly on 2026-09-22; root cause found by the owner in the UI.
    steps:
      # WR-3/WR-4 continuation (v29): the raw `cmake -S` entry (broken against
      # a lone checkout since WR-0) is replaced by the workspace path. CI
      # validates the DISPATCH-STATED graph (2026-10-03 pin cancellation):
      # the control repository rides the resolve job's lock read, the
      # candidate is the dispatch input, and every dependency node checkout
      # rides the SHAs resolved from workspace.lock.json. No node pins live
      # in this file. The replacement proof is an owner-dispatched run.
      - uses: actions/checkout@v6
        if: ${{ needs.plan.outputs[matrix.id] == 'true' }}
        with:
          repository: JasonHuang3D/qiven-workspace
          ref: ${{ needs.resolve.outputs.workspace_commit }}
          path: qiven-workspace
      - uses: actions/checkout@v6
        if: ${{ needs.plan.outputs[matrix.id] == 'true' }}
        with:
          repository: JasonHuang3D/qiven-devkit
          ref: ${{ needs.resolve.outputs.devkit_sha }}
          path: qiven-devkit
      - uses: actions/checkout@v6
        if: ${{ needs.plan.outputs[matrix.id] == 'true' }}
        with:
          repository: JasonHuang3D/qiven-foundation
          ref: ${{ needs.resolve.outputs.foundation_sha }}
          path: qiven-foundation
      - uses: actions/checkout@v6
        if: ${{ needs.plan.outputs[matrix.id] == 'true' }}
        with:
          repository: JasonHuang3D/qiven-context-draft
          ref: ${{ needs.resolve.outputs.context_draft_sha }}
          path: qiven-context-draft
      - uses: actions/checkout@v6
        if: ${{ needs.plan.outputs[matrix.id] == 'true' }}
        with:
          repository: JasonHuang3D/qiven-third-party-win
          ref: ${{ needs.resolve.outputs.third_party_win_sha }}
          path: qiven-third-party-win
      - uses: actions/checkout@v6
        if: ${{ needs.plan.outputs[matrix.id] == 'true' }}
        with:
          repository: JasonHuang3D/qiven-toolchain-win
          ref: ${{ needs.resolve.outputs.toolchain_win_sha }}
          path: qiven-toolchain-win
      - uses: actions/checkout@v6
        if: ${{ needs.plan.outputs[matrix.id] == 'true' }}
        with:
          repository: JasonHuang3D/qiven-runtime
          ref: ${{ needs.resolve.outputs.candidate }}
          path: qiven-runtime
      - name: Configure (workspace bootstrap)
        if: ${{ needs.plan.outputs[matrix.id] == 'true' && matrix.id == 'windows' }}
        run: >-
          python qiven-workspace/bootstrap/qiven-bootstrap.py gate-configure
          --control qiven-workspace --devkit qiven-devkit
          --repo qiven-runtime --repo-root qiven-runtime
          --preset vs2022-x64
          --cmake qiven-toolchain-win/cmake/bin/cmake.exe
      - name: Build (Debug)
        if: ${{ needs.plan.outputs[matrix.id] == 'true' && matrix.id == 'windows' }}
        run: qiven-toolchain-win/cmake/bin/cmake.exe --build qiven-runtime/build/vs2022-x64 --config Debug --parallel
      - name: Test (Debug)
        if: ${{ needs.plan.outputs[matrix.id] == 'true' && matrix.id == 'windows' }}
        run: qiven-toolchain-win/cmake/bin/ctest.exe --test-dir qiven-runtime/build/vs2022-x64 -C Debug --output-on-failure
      - name: Workspace path status (non-windows units)
        if: ${{ needs.plan.outputs[matrix.id] == 'true' && matrix.id != 'windows' }}
        run: >
          echo "[SKIP] ${{ matrix.id }}: the workspace-path CI migration covers the
          supported platform (windows; CMakePresets define vs2022-x64 only).
          Per-platform presets are a WR-5-class follow-up; this run validates
          nothing for ${{ matrix.id }}."

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [resolve, plan, validate]
    runs-on: ubuntu-24.04
    steps:
      - shell: bash
        env:
          RESOLVE: ${{ needs.resolve.result }}
          PLAN: ${{ needs.plan.result }}
          VALIDATE: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          if [[ "$RESOLVE" != success || "$PLAN" != success || ( "$VALIDATE" != success && "$VALIDATE" != skipped ) ]]; then
            echo "[FAIL] CI Gate: WHAT: a requested validation unit did not succeed"
            echo "  WHY: the conclusion is the enforcement; a [SKIP] unit validates"
            echo "  nothing and is never a pass (rule: runtime/ci-gate)"
            echo "  EVIDENCE: resolve=${RESOLVE}, plan=${PLAN}, validate=${VALIDATE}"
            echo "  NEXT action: DIAGNOSE - open the failed unit's step logs,"
            echo "  classify the failure (resolve/plan, configure/build/test), fix"
            echo "  it at the stated revisions, then re-dispatch; a re-dispatch"
            echo "  without a fix is not a retry."
            exit 1
          fi
          echo "CI Gate: requested validation passed"
