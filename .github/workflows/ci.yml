name: CI

run-name: CI / ${{ inputs.jobs }}

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Validation units: full, windows, linux, macos"
        required: true
        default: full
        type: string

# Trigger registration refresh 2026-09-22: phantom zero-job push runs were
# created for every push against this dispatch-only file (stale GitHub-side
# event registration since repo creation). This comment change forces
# re-registration. See qiven-context session-ci-handoff-contract.md.
permissions:
  contents: read

jobs:
  plan:
    name: Validation plan
    runs-on: ubuntu-24.04
    outputs:
      windows: ${{ steps.plan.outputs.windows }}
      linux: ${{ steps.plan.outputs.linux }}
      macos: ${{ steps.plan.outputs.macos }}
    steps:
      - id: plan
        shell: bash
        env:
          REQUESTED: ${{ inputs.jobs }}
        run: |
          case "$REQUESTED" in
            full) selected="windows linux macos" ;;
            windows|linux|macos) selected="$REQUESTED" ;;
            *) echo "Unknown validation unit: $REQUESTED" >&2; exit 1 ;;
          esac
          for unit in windows linux macos; do
            if [[ " $selected " == *" $unit "* ]]; then value=true; else value=false; fi
            echo "$unit=$value" >> "$GITHUB_OUTPUT"
          done

  validate:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: windows, name: Windows MSVC x64, os: windows-2022 }
          - { id: linux, name: Linux GCC x64, os: ubuntu-24.04 }
          - { id: macos, name: macOS AppleClang arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    # matrix is NOT available in a job-level if (GitHub evaluates it before
    # strategy expansion); per-unit gating lives at step level via the plan
    # output keyed by matrix.id (windows|linux|macos match the plan outputs).
    # The former job-level if was INVALID since repo creation (template-
    # inherited) and made every push carrying this file create a zero-job
    # failing run - the "phantom push runs" misclassified as a platform
    # anomaly on 2026-09-22; root cause found by the owner in the UI.
    steps:
      # WR-3/WR-4 continuation (v29): the raw `cmake -S` entry (broken against
      # a lone checkout since WR-0) is replaced by the workspace path. CI
      # validates the LOCKED workspace graph: the control repository is pinned
      # to the admitted revision and every node checkout rides the lock; runs
      # are dispatched after a lock transaction advances (explicit-dispatch
      # law). The replacement proof is an owner-dispatched run.
      - uses: actions/checkout@v6
        if: ${{ needs.plan.outputs[matrix.id] == 'true' }}
        with:
          repository: JasonHuang3D/qiven-workspace
          ref: 423082d428602abc7c21fd1af35652242d4e3cbd
          path: qiven-workspace
      - uses: actions/checkout@v6
        if: ${{ needs.plan.outputs[matrix.id] == 'true' }}
        with:
          repository: JasonHuang3D/qiven-devkit
          ref: 945fdd2b399d6701ba2eab79688a730c009e835f
          path: qiven-devkit
      - uses: actions/checkout@v6
        if: ${{ needs.plan.outputs[matrix.id] == 'true' }}
        with:
          repository: JasonHuang3D/qiven-foundation
          ref: 9045feee0c81fa247dec49407e51e891fe427744
          path: qiven-foundation
      - uses: actions/checkout@v6
        if: ${{ needs.plan.outputs[matrix.id] == 'true' }}
        with:
          repository: JasonHuang3D/qiven-context-draft
          ref: 50288c2ddcf7d3c9cf0fbc2a0a03eff9276bb6ce
          path: qiven-context-draft
      - uses: actions/checkout@v6
        if: ${{ needs.plan.outputs[matrix.id] == 'true' }}
        with:
          repository: JasonHuang3D/qiven-third-party-win
          ref: 318453834315a68fa85374dffa9a77ff73d6e71c
          path: qiven-third-party-win
      - uses: actions/checkout@v6
        if: ${{ needs.plan.outputs[matrix.id] == 'true' }}
        with:
          repository: JasonHuang3D/qiven-runtime
          ref: ba2a959ba3fdf069ae11367e3de39904eedeac51
          path: qiven-runtime
      - name: Configure (workspace bootstrap)
        if: ${{ needs.plan.outputs[matrix.id] == 'true' && matrix.id == 'windows' }}
        run: >-
          python qiven-workspace/bootstrap/qiven-bootstrap.py gate-configure
          --control qiven-workspace --devkit qiven-devkit
          --repo qiven-runtime --repo-root qiven-runtime
          --preset vs2022-x64 --cmake cmake
      - name: Build (Debug)
        if: ${{ needs.plan.outputs[matrix.id] == 'true' && matrix.id == 'windows' }}
        run: cmake --build qiven-runtime/build/vs2022-x64 --config Debug --parallel
      - name: Test (Debug)
        if: ${{ needs.plan.outputs[matrix.id] == 'true' && matrix.id == 'windows' }}
        run: ctest --test-dir qiven-runtime/build/vs2022-x64 -C Debug --output-on-failure
      - name: Workspace path status (non-windows units)
        if: ${{ needs.plan.outputs[matrix.id] == 'true' && matrix.id != 'windows' }}
        run: >
          echo "[SKIP] ${{ matrix.id }}: the workspace-path CI migration covers the
          supported platform (windows; CMakePresets define vs2022-x64 only).
          Per-platform presets are a WR-5-class follow-up; this run validates
          nothing for ${{ matrix.id }}."

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [plan, validate]
    runs-on: ubuntu-24.04
    steps:
      - shell: bash
        env:
          PLAN: ${{ needs.plan.result }}
          VALIDATE: ${{ needs.validate.result }}
        run: |
          [[ "$PLAN" == success ]]
          [[ "$VALIDATE" == success || "$VALIDATE" == skipped ]]
